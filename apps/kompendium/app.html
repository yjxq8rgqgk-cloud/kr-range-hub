  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    // The unpacking above replaces document.documentElement wholesale, which
    // wipes out the "Zurück zum Hub" button + stylesheet that shared/theme.js
    // had already injected before the bundle finished loading. Restore both.
    if (!document.querySelector('link[href*="theme.css"]')) {
      var themeLink = document.createElement('link');
      themeLink.rel = 'stylesheet';
      themeLink.href = '../../shared/theme.css';
      document.head.appendChild(themeLink);
    }
    if (!document.querySelector('.kr-hub-home')) {
      var hubBtn = document.createElement('a');
      hubBtn.className = 'kr-hub-home';
      hubBtn.href = '../../index.html';
      hubBtn.setAttribute('aria-label', 'Zurück zum Hub');
      hubBtn.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>' +
        '<span>Hub</span>';
      document.body.appendChild(hubBtn);
    }
    // The swap above also drops the data-theme attribute theme.js had already
    // set on the old documentElement (dark/light/system choice). Recompute
    // and re-apply it so the app matches the hub's saved preference.
    if (window.KRHubTheme) {
      var _theme = window.KRHubTheme.get();
      var _mode = _theme;
      if (_theme === 'system') {
        _mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', _mode);
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tant;}\n}\n<\u002Fstyle>\n<script src=\"60e08e89-ffe4-4e38-ac66-3afdc07803f8\"><\u002Fscript>\n\n<\u002Fhelmet>\n\n<div data-print-shell=\"\" data-theme=\"{{ theme }}\" style=\"height:100vh;display:flex;flex-direction:column;font-family:'Barlow', system-ui, sans-serif;background:#E4DCC8;color:#1A160E;overflow:hidden;\">\n\n  <!-- ===== HEADER ===== -->\n  <header data-keepdark=\"\" style=\"flex:none;display:flex;align-items:center;gap:20px;padding:0 22px;height:62px;background:#1B1710;border-bottom:2px solid #A85C30;color:#EFE8D6;position:relative;z-index:30;\">\n    <button onclick=\"{{ cycleTheme }}\" title=\"{{ themeTitle }}\" class=\"no-print\" style=\"display:flex;align-items:center;gap:12px;flex:none;background:transparent;border:none;padding:0;cursor:pointer;text-align:left;color:inherit;\">\n      <img src=\"8e2bb3cd-9f44-45d2-857b-e6f6ba0a2204\" alt=\"\" style=\"height:34px;width:auto;opacity:.92;filter:brightness(1.6);\">\n      <div style=\"line-height:1;\">\n        <div style=\"font-family:'Gunplay',sans-serif;font-size:18px;letter-spacing:.02em;\">SCHIESS · KOMPENDIUM<\u002Fdiv>\n        <div style=\"font-family:'Barlow Semi Condensed',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#B59A6E;margin-top:3px;\">Sportordnung · DSB / BSSB / BDS<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fbutton>\n\n    <!-- search -->\n    <div style=\"flex:1;max-width:540px;position:relative;\">\n      <span style=\"position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8A795A;font-size:15px;\">⚲<\u002Fspan>\n      <input value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"Kennziffer (1.10, B.01) oder Name (Luftgewehr) …\" spellcheck=\"false\" style=\"width:100%;height:40px;padding:0 38px 0 38px;border-radius:4px;border:1px solid #4A3F29;background:#262017;color:#EFE8D6;font-family:'Barlow',sans-serif;font-size:14px;outline:none;letter-spacing:.01em;\">\n      <button onclick=\"{{ clearSearch }}\" title=\"Leeren\" style=\"position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;border-radius:3px;background:transparent;color:#8A795A;cursor:pointer;font-size:16px;line-height:1;\">×<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- source filters -->\n    <div style=\"display:flex;gap:6px;flex:none;\" class=\"no-print\">\n      <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <button onclick=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <button onclick=\"{{ openMenu }}\" title=\"Menü\" class=\"no-print\" style=\"flex:none;width:38px;height:38px;border:1px solid #4A3F29;border-radius:4px;background:#262017;color:#B59A6E;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;\">☰<\u002Fbutton>\n\n    <button onclick=\"{{ printPage }}\" title=\"Drucken (Graustufen)\" class=\"no-print\" style=\"flex:none;width:38px;height:38px;border:1px solid #4A3F29;border-radius:4px;background:#262017;color:#B59A6E;cursor:pointer;font-size:16px;\">⎙<\u002Fbutton>\n  <\u002Fheader>\n\n  <!-- ===== BODY ===== -->\n  <div data-print-body=\"\" style=\"flex:1;display:flex;min-height:0;position:relative;\">\n\n    <!-- ===== SIDEBAR ===== -->\n    <aside style=\"flex:none;width:316px;background:#EDE6D4;border-right:1px solid #D2C6A8;display:flex;flex-direction:column;min-height:0;\" class=\"no-print\">\n      <div style=\"flex:none;padding:14px 16px 10px;border-bottom:1px solid #D8CDB2;\">\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:6px;\">\n          <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<span style=\"opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums;\">{{ c.count }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px;font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A795A;\">{{ resultLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;overflow-y:auto;padding:8px 10px 24px;\">\n        <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:40px 16px;text-align:center;color:#8A795A;font-size:13px;line-height:1.6;\">Keine Disziplin gefunden.<br>Andere Kennziffer oder Begriff versuchen.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"margin-top:14px;\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:0 8px 6px;\">\n              <span style=\"font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#A85C30;font-weight:700;\">{{ g.label }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#A89372;\">{{ g.count }}<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#D8CDB2;\"><\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ g.subs }}\" as=\"sub\" hint-placeholder-count=\"1\">\n              <div style=\"margin-bottom:4px;\">\n                <sc-if value=\"{{ g.multiSub }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:5px 9px 2px;font-family:'Barlow Semi Condensed',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9A875E;font-weight:600;\">{{ sub.sub }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-for list=\"{{ sub.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <button onclick=\"{{ it.onClick }}\" style=\"{{ it.style }}\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.02em;padding:2px 6px;border-radius:3px;background:{{ it.codeBg }};color:{{ it.codeColor }};flex:none;min-width:46px;text-align:center;\">{{ it.code }}<\u002Fspan>\n                    <span style=\"flex:1;text-align:left;font-size:13.5px;line-height:1.25;font-weight:{{ it.weight }};color:{{ it.nameColor }};\">{{ it.name }}<\u002Fspan>\n                    <span style=\"flex:none;width:7px;height:7px;border-radius:50%;background:{{ it.dot }};\"><\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <!-- ===== MAIN DETAIL ===== -->\n    <main data-print-main=\"\" style=\"flex:1;min-width:0;overflow-y:auto;background:#E4DCC8;position:relative;\">\n      <!-- watermark -->\n      <img data-print-watermark=\"\" src=\"8e2bb3cd-9f44-45d2-857b-e6f6ba0a2204\" alt=\"\" style=\"position:fixed;right:-40px;bottom:-30px;width:340px;opacity:.05;pointer-events:none;filter:saturate(.4);\">\n\n      <div key=\"{{ sel.id }}\" style=\"position:relative;max-width:1080px;margin:0 auto;padding:30px 40px 80px;animation:krIn .28s var(--e,cubic-bezier(.2,.7,.2,1));\">\n\n        <!-- DETAIL HEADER -->\n        <div style=\"display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap;\">\n          <div style=\"flex:none;\">\n            <div style=\"font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:{{ sel.srcColor }};font-weight:700;margin-bottom:6px;\">{{ sel.srcLabel }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;line-height:1;color:#1A160E;letter-spacing:-.01em;\">{{ sel.code }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:240px;\">\n            <h1 style=\"margin:0;font-family:'Gunplay',sans-serif;font-size:34px;line-height:1.04;text-transform:uppercase;color:#1A160E;letter-spacing:.005em;\">{{ sel.name }}<\u002Fh1>\n            <p style=\"margin:9px 0 0;font-size:15px;line-height:1.55;color:#574B33;max-width:62ch;text-wrap:pretty;\">{{ sel.blurb }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- QUICK STRIP -->\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:#D2C6A8;border:1px solid #D2C6A8;border-radius:6px;overflow:hidden;margin-top:22px;\">\n          <sc-for list=\"{{ sel.quick }}\" as=\"q\" hint-placeholder-count=\"5\">\n            <div style=\"background:#FBF8EF;padding:13px 15px;\">\n              <div style=\"font-family:'Barlow Semi Condensed',sans-serif;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#8A795A;\">{{ q.0 }}<\u002Fdiv>\n              <div style=\"font-size:16px;font-weight:600;color:#1A160E;margin-top:3px;line-height:1.2;\">{{ q.1 }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- LAYOUT SWITCH -->\n        <div style=\"display:flex;align-items:center;gap:14px;margin:26px 0 16px;\" class=\"no-print\">\n          <span style=\"font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A795A;\">Darstellung<\u002Fspan>\n          <div style=\"display:flex;background:#EDE6D4;border:1px solid #D2C6A8;border-radius:5px;padding:3px;gap:3px;\">\n            <sc-for list=\"{{ layouts }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ l.onClick }}\" style=\"{{ l.style }}\">{{ l.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"flex:1;\"><\u002Fspan>\n          <span style=\"font-size:12px;color:#8A795A;\">{{ sel.specCount }} Angaben<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- ===== LAYOUT A: KARTEN ===== -->\n        <sc-if value=\"{{ isCards }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start;\">\n            <div style=\"display:flex;flex-direction:column;gap:18px;\">\n              <sc-for list=\"{{ sel.specGroups }}\" as=\"grp\" hint-placeholder-count=\"3\">\n                <section style=\"background:#FBF8EF;border:1px solid #D8CDB2;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(60,45,20,.05);\">\n                  <div style=\"padding:11px 16px;border-bottom:1px solid #ECE3CC;border-left:3px solid #A85C30;background:#F6F1E2;font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1A160E;\">{{ grp.title }}<\u002Fdiv>\n                  <div>\n                    <sc-for list=\"{{ grp.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex;gap:16px;padding:11px 16px;border-top:1px solid #F0E9D6;align-items:baseline;\">\n                        <div style=\"flex:none;width:38%;font-family:'Barlow Semi Condensed',sans-serif;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:#8A795A;display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n                          <span>{{ r.label }}<\u002Fspan>\n                          <sc-for list=\"{{ r.refChips }}\" as=\"rc\" hint-placeholder-count=\"1\"><button onclick=\"{{ rc.onRef }}\" title=\"Regel ansehen\" style=\"flex:none;border:1px solid #D8C39E;background:#F3E9D2;color:#8C4F2C;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:1px 5px;cursor:pointer;line-height:1.4;\">§ {{ rc.sec }}<\u002Fbutton><\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"flex:1;font-size:14.5px;line-height:1.45;color:#1A160E;font-weight:500;\">{{ r.value }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsection>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-d rtordnung (Wettbewerb 7.30). Langwaffe (Vorderlader) · 50 m · Anschlag Stehend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.31':{src:'DSB',sec:'Disziplin 7.31',title:'Steinschlossgewehr 100 m',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.31). Langwaffe (Vorderlader) · 100 m · Anschlag Liegend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.32':{src:'DSB',sec:'Disziplin 7.32',title:'Luntenschlossgewehr 50 m',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.32). Langwaffe (Vorderlader) · 50 m · Anschlag Stehend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.35':{src:'DSB',sec:'Disziplin 7.35',title:'Muskete 50 m',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.35). Langwaffe (Vorderlader) · Kaliber 16,5 mm · 50 m · Anschlag Stehend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.40':{src:'DSB',sec:'Disziplin 7.40',title:'25 m Perkussionsrevolver',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.40). Kurzwaffe (Vorderlader) · 25 m · Anschlag Stehend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.50':{src:'DSB',sec:'Disziplin 7.50',title:'25 m Perkussionspistole',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.50). Kurzwaffe (Vorderlader) · 25 m · Anschlag Stehend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.60':{src:'DSB',sec:'Disziplin 7.60',title:'25 m Steinschlosspistole',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.60). Kurzwaffe (Vorderlader) · 25 m · Anschlag Stehend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.61':{src:'DSB',sec:'Disziplin 7.61',title:'Luntenschlosspistole 10 m',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.61). Kurzwaffe (Vorderlader) · 10 m · Anschlag Stehend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.71':{src:'DSB',sec:'Disziplin 7.71',title:'Perkussionsflinte',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.71). Langwaffe (Vorderlader) · Kaliber 2,6 mm · 50 m · Anschlag Stehend. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'd-7.72':{src:'DSB',sec:'Disziplin 7.72',title:'Steinschlossflinte',page:'Übersicht · S. 96',text:'Eintrag in der Disziplinen-Übersicht der DSB-Sportordnung (Wettbewerb 7.72). Langwaffe (Vorderlader) · Kaliber 2,6 mm. Maßgeblich für Zulassung, Anschlag, Schusszahl und Scheibe.'},\n    'lg-energie':{src:'DSB',sec:'0.5.1.1',page:'Teil 0 · S. 14',title:'Zugelassene Luftdruckwaffen',text:'Zugelassen sind Luftdruck-, Federdruck- und Gasdruckwaffen mit einer Geschossenergie bis 7,5 Joule. Der Schütze ist für seine Druckluft- bzw. Druckgaskartusche allein verantwortlich.'},\n    'schaft-lg':{src:'DSB',sec:'1.4.7',page:'Teil 1 · S. 10',title:'Schaftkappe Luftgewehr',text:'Die Schaftkappe darf nach rechts oder links versetzt werden, dabei darf der Abstand der äußersten Messpunkte max. 30 mm von der Normalstellung aus betragen.'},\n    'abm-lg':{src:'DSB',sec:'1.5.4',page:'Teil 1 · S. 11',title:'Abmessungen für Luftgewehr',text:'Maximale Systemlänge bei Luftgewehr: 850 mm. Länge des Korntunnels max. 50 mm. Die Maximalmaße der Dimensionen werden von der Laufachse aus gemessen; sämtliche Zusatzgewichte müssen innerhalb der Schaftabmessungen liegen.'},\n    'abzug-pruef':{src:'DSB',sec:'0.10.1',page:'Teil 0 · S. 36',title:'Prüfung des Abzugswiderstands',text:'Es muss ein Gewicht mit einer Metallschneide benutzt werden. Eine Rolle am Abzugsgewicht ist nicht gestattet; es darf nur ein Prüfgewicht ohne Feder(n) benutzt werden. Das Mindestabzugsgewicht muss während des gesamten Wettkampfes stimmen. Maximal werden 3 Versuche gemacht.'},\n    'sch1':{src:'DSB',sec:'0.20',page:'Teil 0 · S. 62',title:'Scheibe Nr. 1 — 10 m Gewehr',text:'Ring-Ø in mm: 10 = 0,5 · 9 = 5,5 · 8 = 10,5 · 7 = 15,5 · 6 = 20,5 · 5 = 25,5 · 4 = 30,5 · 3 = 35,5 · 2 = 40,5 · 1 = 45,5 (Toleranz ±0,1). Der Innenzehner (≥ 10,2) gilt als getroffen, wenn der weiße Punkt vollkommen weggeschossen ist.'},\n    'sch3':{src:'DSB',sec:'0.20',page:'Teil 0 · S. 63',title:'Scheibe Nr. 3 — 50 m Gewehr',text:'Ring-Ø in mm: 10 = 10,4 · 9 = 26,4 · 8 = 42,4 · 7 = 58,4 · 6 = 74,4 · 5 = 90,4 · 4 = 106,4 … Spiegel (schwarz) bis Ring 4. Innenzehner Ø entsprechend Lehre.'},\n    'sch4':{src:'DSB',sec:'0.20',page:'Teil 0 · S. 64',title:'Scheibe Nr. 4 — 50 m Pistole / 25 m Präzision',text:'Ring-Ø in mm: 10 = 50 · 9 = 100 · 8 = 150 · 7 = 200 · 6 = 250 · 5 = 300 · 4 = 350 · 3 = 400 · 2 = 450 · 1 = 500. Innenzehner Ø 25,0 mm.'},\n    'sch7':{src:'DSB',sec:'0.20',page:'Teil 0 · S. 65',title:'Scheibe Nr. 7 — 10 m Pistole',text:'Ring-Ø in mm: 10 = 11,5 · 9 = 27,5 · 8 = 43,5 · 7 = 59,5 · 6 = 75,5 · 5 = 91,5 · 4 = 107,5 · 3 = 123,5 · 2 = 139,5 · 1 = 155,5. Innenzehner Ø 5,0 mm. Spiegel (schwarz) Ø 59,5 mm.'},\n    'sch10':{src:'DSB',sec:'0.20',page:'Teil 0 · S. 67',title:'Scheibe Nr. 10 — 25 m Schnellfeuerpistole',text:'Fünf identische Klappscheiben nebeneinander. Wertungsringe 5–10; das Schwarze umfasst die Ringe 5–10.'},\n    'abzug-pist':{src:'DSB',sec:'Teil 2',page:'Teil 2 · S. 23',title:'10 m Luftpistole — Sportgerät',text:'Gewicht ≤ 1.500 g, Abzugswiderstand ≥ 500 g, Kaliber 4,5 mm (.177). Prüfkasten 420 × 200 × 50 mm (Toleranz 0 bis +1 mm). Gasentlastung und Kompensator erlaubt, einschüssig.'},\n    'abzug-25':{src:'DSB',sec:'Teil 2',page:'Teil 2 · S. 23',title:'25 m Pistole / Schnellfeuer — Sportgerät',text:'Gewicht ≤ 1.400 g, Abzugswiderstand ≥ 1.000 g, Kaliber 5,6 mm Randfeuer (.22 lfb). Prüfkasten 300 × 150 × 50 mm, Lauflänge ≤ 153 mm, Visierlinie ≤ 220 mm. Bei Schnellfeuer: Kompensatoren und Mündungsbremsen nicht erlaubt.'},\n    'visier-pist':{src:'DSB',sec:'2.10.5',page:'Teil 2 · Visierung',title:'Visierung — nur offene Visierung',text:'Es ist nur eine offene Visierung (Kimme / Korn) erlaubt. Optische, spiegel-, laserstrahl-, fernrohrartige sowie elektronische Hilfen etc. sind verboten. Jegliche Arten von Zielgeräten, die in der Lage sind, den Abzug auszulösen, sind verboten. Visierschutz an Kimme und Korn ist nicht erlaubt. Maße der Visierlinie siehe Pistolentabelle.'},\n    'tk-zulassung':{src:'DSB',sec:'0.5',page:'Teil 0 · Waffen & Ausrüstung',title:'Zulassung durch die Technische Kommission',text:'Über die Zulassung von Waffen, Munition und Ausrüstung entscheidet die Technische Kommission (TK) des DSB. Elektronische Zielerkennung sowie die Koppelung mit dem Abzugssystem sind verboten. Im Gewichtslimit der Waffe ist das Zubehör (Magazin, Handstopp, Visiereinrichtungen, Handstütze usw.) enthalten.'},\n    'tk-mitteilung':{src:'DSB',sec:'Teil 14',page:'Teil 14 · Technische Kommission',title:'Mitteilungen der Technischen Kommission',text:'Teil 14 der Sportordnung enthält die verbindlichen Mitteilungen der Technischen Kommission (TK) des DSB. Sie konkretisieren u. a. zugelassene Visierungen (Kimme-/Kornformen), Hilfsmittel und Ausrüstung — z. B. „die TK-Anweisungen zu den Visieren sind zu beachten“. Aktuelle TK-Mitteilungen sind stets in der jeweils gültigen Fassung maßgeblich.'},\n    'abzug-gk':{src:'DSB',sec:'Teil 2',page:'Teil 2 · S. 23',title:'25 m Pistole/Revolver (GK) — Sportgerät',text:'Gewicht ≤ 1.500 g, Abzugswiderstand ≥ 1.000 g. Kaliber u. a. 9 mm Luger (9×19), .45 ACP, .357 Magnum, .44 Magnum. Lauflänge ≤ 153 mm, Visierlinie ≤ 220 mm. Revolver im Kaliber .44 Magnum: Lauflänge ≤ 166 mm, Gewicht ≤ 1.550 g.'},\n    'fertig':{src:'DSB',sec:'2.6',page:'Teil 2 · S. 9',title:'Fertighaltung',text:'Bei den Schnellfeuer- und Duell-Wettbewerben muss die Waffe in der Fertighaltung gehalten werden: Arm zur Waffengrube nach unten, der Winkel zur Waagrechten darf 45° nicht überschreiten, bis das Erscheinen der Scheibe / das Startsignal die Schussabgabe freigibt.'},\n    'flinte':{src:'DSB',sec:'Teil 3',page:'Teil 0 · S. 82',title:'Flinte Trap — Sportgerät & Munition',text:'Langwaffe, Lauflänge min. 40 cm, Laufschiene/Korn. Kaliber 12/70; Schrote max. 2,6 mm; Schrotgewicht max. 24,5 g. Geschossen wird auf Wurfscheiben (Wurftauben) nach Rottenplan, ohne Zeitbegrenzung.'},\n    'b01':{src:'BSSB',sec:'B.01',page:'Regelheft · S. 4',title:'Mehrschüssiges Luftgewehr 10 m',text:'Stehend freihändig. Vor Wettkampfbeginn ist das Einschießen auf eine stehende Scheibe Luftgewehr 10 m in 150 Sekunden gestattet. Es gelten ergänzend die Regeln der aktuellen SpO Teil 0 des DSB.'},\n    'b17':{src:'BSSB',sec:'B.17',page:'Regelheft · S. 40',title:'Traditioneller Zimmerstutzen',text:'Zugelassen sind Zimmerstutzen alter Bauart (Vorderlader-, Löffel-, Block- oder Stiegele-Zimmerstutzen) bzw. originalgetreue Nachbauten mit Originalvisierung. Optische Gläser sind nicht zulässig; das Korn darf nur auf dem Lauf angebracht sein.'},\n    'b17-sch':{src:'BSSB',sec:'B.17',page:'Regelheft · S. 40',title:'Scheibe Zimmerstutzen',text:'Zimmerstutzenscheibe des DSB für 15 Meter. Bei anderen Entfernungen ist auch die LG-Scheibe des DSB für 10 Meter (oder entsprechende elektronische Schießstände) möglich.'},\n    'b20':{src:'BSSB',sec:'B.20',page:'Regelheft · S. 42',title:'Mehrschüssige Luftpistole 10 m',text:'Mehrlader-Luftpistole, stehend. Es darf die in der SpO Teil 2 des DSB geregelte Kleidung getragen werden; es gelten ebenfalls die Regeln der aktuellen SpO Teil 0 des DSB.'},\n    'bds-25':{src:'BDS',sec:'25 m KW',page:'Sportordnung BDS',title:'25 m Kurzwaffe — Präzision & Kombi',text:'Pistole und Revolver, Klein- und Großkaliber, offene und optische Visierung, ein- oder beidhändig. Präzision: BDS-Kurzwaffenscheibe. Kombi (zusätzlich): Intervall 2×5 Schuss in je 3/7 s, 1×5 in 20 s, 1×5 in 10 s. Die 20 Schuss Präzision können getrennt von den 40 Schuss Kombi gewertet werden.'},\n    'bds-ft':{src:'BDS',sec:'Field Target',page:'Sportordnung BDS',title:'Field Target',text:'Unblutige Jagd-Simulation auf lebensgroße Stahl-Silhouetten mit Trefferloch („Hit Zone“). Einzellader-Luftgewehr mit Zielfernrohr; offene Klasse bis 16,3 Joule (Pressluft) bzw. Feder-/Gasdruck. Entfernungsmessgeräte sind nicht erlaubt; ein Parcours hat meist 50 Ziele.'}\n  ,\n    'bds-25b':{src:'BDS',sec:'25 m Büchse',page:'Sportordnung BDS',title:'25 m Präzision Büchse',text:'Jüngste Disziplin im BDS-Standardprogramm: Büchsen in Kurzwaffenkalibern, stehend freihändig auf 25 m. Klein- und Großkaliber, offene und optische Visierung. Es zählen nur die Ringe 6–10 der BDS-Kurzwaffenscheibe bzw. der 25m-Präzisionsscheibe/Büchse (plus Innenzehn). 2×10 Schuss in 2×5 Minuten.'},\n    'bds-50':{src:'BDS',sec:'50 m LW',page:'Sportordnung BDS',title:'50 m Langwaffe',text:'Kürzeste Distanz für Langwaffen im Liegendanschlag, KK- und KW-Patronen. Präzision (2×10 Schuss in 2×10 min) sowie dynamische Teile Zeitserie (je 2×5 in 40/30/20 s, 2×4 in 10 s), Fertigkeit und Symbolscheibe. Liegend freihändig, mit Zweibein oder aufgelegt; offene und optische Visierung.'},\n    'bds-100':{src:'BDS',sec:'100 m LW',page:'Sportordnung BDS',title:'100 m Langwaffe',text:'Präzisions- und dynamische Disziplinen (Zeitserie, Fertigkeit) mit Großkaliber- und .22-lr-Langwaffenpatronen. Liegend freihändig, mit Zweibein oder aufgelegt; offene und optische Visierung. Scheiben: BDS-100m-Scheibe, ISSF-100m-Scheibe, ZF-Scheiben.'},\n    'bds-300':{src:'BDS',sec:'300 m LW',page:'Sportordnung BDS',title:'300 m Langwaffe',text:'Längste Schießdistanz für Sportschützen in Deutschland, mit Ordonnanz-, Matchsport- und modernen Präzisionsgewehren. Großkaliber-Langwaffenpatronen, liegend. 2×10 Schuss in 2×10 Minuten; unterhalb der LM 15 Schuss in 15 Minuten.'},\n    'bds-mdkw':{src:'BDS',sec:'MD-KW',page:'Sportordnung BDS',title:'Mehrdistanz Kurzwaffe',text:'„Perfekte Alternative zum bekannten IPSC“: von unterschiedlichen Positionen wird auf Scheiben geschossen — Schnelligkeit und Präzision müssen abgewogen werden. Pistole/Revolver, KK und GK, BDS-Kurzwaffenscheibe, sichere Beidhandgriffe. Pistolen starten mit 4 Magazinen (max. 60 s), Revolver mit 4 Speedloadern (max. 70 s); kein Speedloader-Einsatz bei Revolver im Parcours.'},\n    'bds-mdb':{src:'BDS',sec:'MD-Büchse',page:'Sportordnung BDS',title:'Mehrdistanz Büchse',text:'Fertigkeits- und Parcoursschießen mit halbautomatischen Büchsen, Unterhebelrepetierbüchsen und Pistolen mit Anschlagschaft — in Kurzwaffenkaliber/.22 sowie als Ergänzung im Langwaffenkaliber. Start mit 3 Magazinen à 5 Schuss; Unterhebelrepetierer mit Röhrenmagazin max. 70 s, Waffen mit Wechselmagazinen max. 50 s.'},\n    'bds-mdf':{src:'BDS',sec:'MD-Flinte',page:'Sportordnung BDS',title:'Mehrdistanz Flinte',text:'Mehrdistanzschießen mit Selbstlade- und Repetierflinten, von unterschiedlichen Positionen. Offene und optische Visierung, stehend freihändig im Voranschlag; BDS-Speed-Scheibe.'},\n    'bds-fall':{src:'BDS',sec:'Fallscheiben',page:'Sportordnung BDS',title:'Fallscheiben-Schießen',text:'Dynamischste Disziplingruppe: auf fünf nebeneinander stehende Fallplatten wird so schnell wie möglich geschossen. Pro nicht gefallene Fallscheibe gibt es 10 Sekunden Strafzeit. 25 m (Kurzwaffe, Büchse) bzw. 15 m (Flinte), Klein- und Großkaliber, offene und optische Visierung.'},\n    'bds-speed':{src:'BDS',sec:'Speed',page:'Sportordnung BDS',title:'Speed-Schießen',text:'Speed-Schießen mit Kurz- und Langwaffen (KK-Pistole bis Flinte). Die erreichten Ringe der BDS-Speed-Scheibe werden zusammengezählt; die benötigte Zeit wird anschließend von der Ringzahl abgezogen. Kurzwaffe und Büchse: 30 Wertungsschuss.'},\n    'bds-steel':{src:'BDS',sec:'Speed Steel',page:'Sportordnung BDS',title:'Speed Steel',text:'Dynamisches Schießen mit Sportwaffen auf Stahlziele — schließt die Lücke zwischen Standardprogramm und IPSC. Zentralfeuer-Kurzwaffen werden aus dem Holster gezogen; mit KK/Schaftwaffen wird auf einen Startmarker gezielt. Abwechslungsreiche Stages mit Pflicht-Nachladevorgang; ca. 25–40 Schuss pro Stage, 120–150 pro Match.'},\n    'bds-sil':{src:'BDS',sec:'Silhouette',page:'Sportordnung BDS',title:'Silhouetten-Schießen',text:'Geschossen wird auf spezielle Stahlziele in Tierform — Huhn, Schwein, Truthahn und Widder — auf jeweils unterschiedliche Entfernungen. Wertung denkbar einfach: das Ziel muss umfallen.'},\n    'ipsc-div':{src:'BDS',sec:'IPSC',page:'IPSC-Regelwerk · BDS',title:'IPSC — Wettkampfarten & Divisions',text:'Handgun (Pistole/Revolver): Open, Standard, Production, Revolver, Classic, Production Optics, Optics. Shotgun: Open, Standard, Modified, Standard Manual. Rifle: Semi Auto Standard (offen, Kompensator max. 30×90 mm), Semi Auto Open (Optik). Mini Rifle: Standard, Open. PCC: PC Iron, PC Optic. Production-Waffen müssen in einen Kasten 225×150×45 mm passen.'},\n    'ipsc-score':{src:'BDS',sec:'IPSC',page:'IPSC-Regelwerk · BDS',title:'IPSC — Wertung (Hit Factor)',text:'Motto DVC: diligentia, vis, celeritas (Präzision, Kraft, Schnelligkeit). Papierscheiben mit Zonen A/B/C — A = 5, B = 3, C = 1 Punkt (Major: 5/4/2). Trefferpunkte minus Strafpunkte, geteilt durch die benötigte Zeit, ergibt den Treffer-Faktor (Hit Factor). Zugang nur mit bestandenem Sicherheits- und Regeltest (SURT). Level 1–5 (Vereins- bis Weltmeisterschaft).'},\n    'west-gen':{src:'BDS',sec:'Western',page:'Sportordnung BDS',title:'Westernschießen (Cowboy Action Shooting)',text:'Dynamischer Schießsport und „Living History“ im historischen Outfit. Jeder Schütze benötigt zwei Single-Action-Revolver, einen Unterhebelrepetierer und eine Schrotflinte aus der Epoche. Geschossen wird auf Stahlziele (Klappfallziele oder stehende Gongs) — keine Ringe oder Trefferzonen. Gewinner ist die kürzeste Gesamtzeit; Fehler ergeben Zeitstrafen. SURT verpflichtend. Ein Match hat bis zu 16 Stages.'},\n    'west-cls':{src:'BDS',sec:'Western',page:'Sportordnung BDS',title:'Western — Klassen 1870 / 1880 / 1890',text:'1890 (Einsteigerklasse, geringste Einschränkungen, Nitropulver, beidhändiger Revolveranschlag). 1880 (periodisch korrekt: 2 SA-Revolver bis Bj. 1890, Lever/Slide-Action bis Bj. 1884, Querflinte; Black Powder oder Nitro; mind. 5 authentische Outfit-Stücke). 1870 (Schwarzpulver-Enthusiasten: 2 Perkussionsrevolver ab .36, Lever/Slide-Action bis Bj. 1873; authentisches Outfit).'}\n  ,\n    'bds-lr':{src:'BDS',sec:'Long Range',page:'Sportordnung BDS',title:'Long Range-Schießen',text:'Präzisionsschießen auf große Distanzen mit Hochleistungs- und Selbstladegewehren. Klassen LR1 F/TR, LR2 Open, LR3 Magnum, LR4 Ultra Magnum, LR5 Semi Auto, LR6 Semi Auto Open, LR7 Standard, LR8 Standard Open. Kennziffern 4901 – 4908.'},\n    'bds-steelch':{src:'BDS',sec:'Steel Challenge',page:'Sportordnung BDS',title:'Steel Challenge',text:'Internationales Stahlziel-Schießen auf Zeit mit festgelegten Stages. Klassen für Pistole, Revolver, Selbstladebüchse — jeweils Open und Standard, dazu Rimfire-Varianten (.22). Kennziffern 10001 – 10012.'},\n    'bds-perk':{src:'BDS',sec:'Perkussion',page:'Sportordnung BDS',title:'Perkussionsschießen (Vorderlader)',text:'Schießen mit Vorderlader- und historischen Waffen: Perkussions-, Stein- und Radschloss sowie Originalsysteme. Pistolen, Revolver und Gewehre in zahlreichen Klassen (Standard/Frei), Muskete, Einzel- und Mehrladergewehr. Kennziffern 6101 – 7102.'},\n    'bds-wurf':{src:'BDS',sec:'Wurfscheibe',page:'Sportordnung BDS',title:'Wurfscheiben-Schießen',text:'Flinten-Wurfscheibendisziplinen des BDS: Trap, Skeet, Parcours sowie Doppel-, Selbstlade- und Repetierflinten-Klassen. Kennziffern 4601 – 4704.'}\n  };\n\n  // ---- disciplines ----\n  DATA = [\n    {id:'dsb-1-10',src:'DSB',code:'1.10',name:'Luftgewehr 10 m',cat:'Gewehr',tags:'lg luftgewehr 10m olympisch zuganlage',\n      blurb:'Die olympische Königsdisziplin im Gewehr: stehend fr
