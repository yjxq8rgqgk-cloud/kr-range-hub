<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../shared/theme.css">
<script src="../../shared/theme.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meine Waffen">
<meta name="theme-color" content="#14110B">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Gunplay'; src: url('fonts/gunplay_rg.otf') format('opentype'); font-weight: 400 700; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .kr-ghost { transition: background 160ms cubic-bezier(.2,.7,.2,1), border-color 160ms, transform 120ms; }
  .kr-ghost:hover { background: #F4EEE0; border-color: #C9824E; }
  .kr-ghost:active { transform: translateY(1px); }
  .kr-cu { transition: background 160ms cubic-bezier(.2,.7,.2,1), transform 120ms; }
  .kr-cu:hover { background: #C9824E; }
  .kr-cu:active { background: #8C4F2C; transform: translateY(1px); }
  .kr-danger { transition: background 160ms, transform 120ms; }
  .kr-danger:hover { background: #8E3424; }
  .kr-danger:active { transform: translateY(1px); }
  .kr-ico { transition: background 140ms, border-color 140ms, color 140ms, transform 120ms; }
  .kr-ico:active { transform: translateY(1px); }
  .kr-icoedit { color: var(--c-label, #5A4A30); } .kr-icoedit:hover { background: #F4EEE0; border-color: #C9824E; color: #B26A3E; }
  .kr-icodel { color: var(--c-label, #5A4A30); } .kr-icodel:hover { background: #FBEDE9; border-color: #A8402E; color: #A8402E; }
  .kr-dash { transition: background 160ms, border-color 160ms; }
  .kr-dash:hover { background: #F1E9D9; border-color: #B26A3E; }
  .kr-row { transition: border-color 160ms, transform 120ms; }
  .kr-row:hover { border-color: #C9824E; }
</style>
<style>
  :root{
    --c-bg:#F3EEE1; --c-header:#D7CAAE; --c-headerline:#C2B595; --c-surface:#FCFAF4;
    --c-input:#FFFFFF; --c-thumb:#EDE4D0; --c-border:#C7BBA1; --c-divider:#D6CCB6;
    --c-dash:#C9A982; --c-dashbg:rgba(252,250,244,0.55);
    --c-text:#211C13; --c-strong:#2B2418; --c-body:#4A3F29; --c-label:#5A4A30;
    --c-dim:#6E5F44; --c-faint:#8C7B58; --c-capbtn:#211C13; --c-capborder:#3A3122; --c-frame:#1B1812;
  }
  html.kr-dark{
    --c-bg:#14110B; --c-header:#221C12; --c-headerline:#2E2616; --c-surface:#1E1810;
    --c-input:#15100A; --c-thumb:#241D12; --c-border:#382D1C; --c-divider:#2C2415;
    --c-dash:#4A3B23; --c-dashbg:rgba(34,28,18,0.5);
    --c-text:#ECE4D2; --c-strong:#DCD1B6; --c-body:#C6B796; --c-label:#A89569;
    --c-dim:#B0A082; --c-faint:#94855F; --c-capbtn:#0E0A05; --c-capborder:#281F12; --c-frame:#0E0B06;
  }
  html.kr-dark .kr-ghost:hover{ background:#2A2316; border-color:#C9824E; }
  html.kr-dark .kr-iconbtn:hover{ background:#2A2316; border-color:#C9824E; }
  html.kr-dark .kr-icoedit:hover{ background:#2A2316; border-color:#C9824E; color:#C9824E; }
  html.kr-dark .kr-icodel:hover{ background:#2E1B16; border-color:#A8402E; color:#D2705E; }
  html.kr-dark .kr-dash:hover{ background:#241D12; border-color:#B26A3E; }
  html.kr-dark .kr-field::placeholder{ color:#7C6E50; }
  html.kr-dark svg[stroke="#A89A7C"]{ stroke:#6E6450; }
  html.kr-dark svg[stroke="#211C13"]{ stroke:#ECE4D2; }
  html.kr-dark [fill="#211C13"]{ fill:#ECE4D2; }
  html.kr-dark img[alt="KR"]{ filter: brightness(0) invert(1) opacity(0.82) !important; }
  html.kr-dark img[aria-hidden="true"]{ filter: brightness(0) invert(1) !important; }
</style>
<script>
(function(){
  function apply(){ try{ document.documentElement.classList.toggle('kr-dark', document.documentElement.getAttribute('data-theme') !== 'light'); }catch(e){} }
  apply();
  window.addEventListener('storage', function(e){ if(!e||e.key==null||e.key==='kr-hub-theme') apply(); });
  window.__krApplyTheme = apply;
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('app:seeded') === '1') return;
    function seedIfEmpty(key, data){
      var cur = localStorage.getItem(key), empty = true;
      if (cur){ try { var v = JSON.parse(cur); empty = !(Array.isArray(v) && v.length); } catch(e){ empty = true; } }
      if (empty) localStorage.setItem(key, JSON.stringify(data));
    }
    seedIfEmpty('waffen:liste', [
      { hersteller: 'Heckler & Koch', bezeichnung: 'P30', kaliber: '9 mm Luger', seriennummer: 'HK-204571', foto: '' },
      { hersteller: 'CZ', bezeichnung: '457 Varmint', kaliber: '.22 lr', seriennummer: 'CZ-889123', foto: '' }
    ]);
    seedIfEmpty('munition:liste', [
      { hersteller: 'RUAG GECO', kaliber: '9 mm Luger', gewicht: '8,0 g / 124 gr', speed: '360 m/s', foto: '' },
      { hersteller: 'SK Standard Plus', kaliber: '.22 lr', gewicht: '2,6 g / 40 gr', speed: '331 m/s', foto: '' }
    ]);
    seedIfEmpty('zubehoer:liste', [
      { hersteller: 'Aimpoint', teil: 'Rotpunktvisier Micro H-2', verbautAn: 'Heckler & Koch P30  \u00b7  SN HK-204571', notizen: 'Montage auf dem Verschluss, 2 MOA. Batterie zuletzt 03/2025 gewechselt.', foto: '' },
      { hersteller: 'Harris', teil: 'Zweibein 6\u20139\u2033', verbautAn: 'CZ 457 Varmint  \u00b7  SN CZ-889123', notizen: 'Schnellverschluss-Adapter, bei K\u00e4lte leicht klemmig.', foto: '' }
    ]);
    seedIfEmpty('profil:vereine', [
      { name: 'SV Tell Hubertus', nr: '1894-22', mitglied: '04711', eintritt: '2019-03-12' },
      { name: 'BDS Gau Mittelrhein', nr: 'GM-7783', mitglied: '11920', eintritt: '2021-09-01' }
    ]);
    seedIfEmpty('profil:wbk', [
      { farbe: 'gr\u00fcn', behoerde: 'Landratsamt Musterstadt', datum: '2022-05-17', nummer: 'WBK-2022-0815', nid: 'NID-44120', nud: 'NUD-77810' },
      { farbe: 'gelb', behoerde: 'Ordnungsamt Beispielheim', datum: '2023-11-03', nummer: 'WBK-2023-1190', nid: 'NID-50233', nud: 'NUD-90021' }
    ]);
    localStorage.setItem('app:seeded','1');
  } catch(e){}
})();
</script>
<script src="./i18n.js"></script>
</helmet>
<div style="min-height: 100vh; background: var(--c-bg, #F3EEE1); font-family: 'Barlow', system-ui, sans-serif; color: var(--c-text, #211C13); display: flex; flex-direction: column;">

  <!-- HEADER -->
  <header style="position: sticky; top: 0; z-index: 50; padding-top: env(safe-area-inset-top); background: var(--c-header, #D7CAAE); border-bottom: 1px solid var(--c-headerline, #C2B595);">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 920px; margin: 0 auto; width: 100%; padding: 14px 24px;">
      <div style="display: flex; align-items: center; gap: 14px; min-width: 0;">
        <a href="Menue.dc.html" class="kr-ghost" aria-label="Zurück" title="Zurück" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; background: var(--c-surface, #FCFAF4); border: 1px solid var(--c-border, #C7BBA1); border-radius: 10px; color: var(--c-text, #211C13); text-decoration: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
        <h1 style="font-family: 'Gunplay', 'Arial Black', sans-serif; font-size: 28px; line-height: 1.02; letter-spacing: -0.01em; text-transform: uppercase; color: var(--c-text, #211C13); margin: 0;">Meine Munition</h1>
      </div>
      <img src="assets/kr-mark-line.png" alt="KR" style="height: 36px; width: auto; flex-shrink: 0; filter: brightness(0.22) saturate(1.1);">
    </div>
  </header>

  <!-- BODY -->
  <main style="flex: 1; max-width: 920px; margin: 0 auto; width: 100%; padding: 22px 24px 0;">
    <section style="padding-bottom: 22px;">
      <h2 style="font-family: 'Gunplay', 'Arial Black', sans-serif; font-size: 22px; text-transform: uppercase; color: var(--c-text, #211C13); margin: 0 0 6px;">Munitionssorten</h2>
      <p style="font-family: 'Barlow', sans-serif; font-size: 14px; line-height: 1.5; color: var(--c-dim, #6E5F44); margin: 0 0 16px;">Alle Sorten mit Foto, Hersteller, Kaliber, Gewicht und Geschwindigkeit.</p>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}">
          <div style="padding: 26px 18px; text-align: center; border: 1px dashed var(--c-dash, #C9A982); border-radius: 8px; color: var(--c-faint, #8C7B58); font-family: 'Barlow', sans-serif; font-size: 14px;">Noch keine Munitionssorten angelegt.</div>
        </sc-if>
        <sc-for list="{{ view }}" as="m" hint-placeholder-count="0">
          <div class="kr-row" style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: var(--c-surface, #FCFAF4); border: 1px solid var(--c-border, #C7BBA1); border-left: 3px solid #B26A3E; border-radius: 8px;">
            <sc-if value="{{ m.hasFoto }}" hint-placeholder-val="{{ false }}">
              <img src="{{ m.foto }}" alt="" style="flex-shrink: 0; width: 72px; height: 54px; object-fit: contain; border-radius: 6px; background: var(--c-frame, #1B1812); border: 1px solid var(--c-border, #C7BBA1);">
            </sc-if>
            <sc-if value="{{ m.noFoto }}" hint-placeholder-val="{{ true }}">
              <div style="flex-shrink: 0; width: 72px; height: 54px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--c-thumb, #EDE4D0); border: 1px solid var(--c-divider, #D6CCB6); color: #B0A07E;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              </div>
            </sc-if>
            <div style="flex: 1; min-width: 0;">
              <div style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--c-text, #211C13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ m.title }}</div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--c-dim, #6E5F44); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ m.meta }}</div>
            </div>
            <button onClick="{{ m.onEdit }}" class="kr-ico kr-icoedit" aria-label="Bearbeiten" title="Bearbeiten" style="flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; background: var(--c-input, #FFFFFF); border: 1px solid var(--c-border, #C7BBA1); border-radius: 8px; cursor: pointer;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
            </button>
            <button onClick="{{ m.onDelete }}" class="kr-ico kr-icodel" aria-label="Löschen" title="Löschen" style="flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; background: var(--c-input, #FFFFFF); border: 1px solid var(--c-border, #C7BBA1); border-radius: 8px; cursor: pointer;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>
        </sc-for>
        <button onClick="{{ openNew }}" class="kr-dash" style="width: 100%; height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--c-dashbg, rgba(252,250,244,0.55)); border: 2px dashed var(--c-dash, #C9A982); border-radius: 8px; color: #B26A3E; cursor: pointer; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Neue Munitionssorte hinzufügen
        </button>
      </div>
    </section>
  </main>

  <!-- FERTIG -->
  <div style="max-width: 920px; margin: 0 auto; width: 100%; padding: 0 24px 26px;">
    <a href="Menue.dc.html" class="kr-cu" style="width: 100%; height: 52px; display: inline-flex; align-items: center; justify-content: center; background: #B26A3E; border-radius: 8px; color: #FCFAF4; text-decoration: none; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.1em;">Fertig</a>
  </div>

  <!-- LÖSCHEN BESTÄTIGEN -->
  <sc-if value="{{ confirmOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 60; background: rgba(20,17,11,0.6); display: flex; align-items: center; justify-content: center; padding: 24px;">
      <div style="width: 100%; max-width: 400px; background: var(--c-bg, #F3EEE1); border: 1px solid var(--c-border, #C7BBA1); border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,0.5); overflow: hidden;">
        <div style="padding: 24px 24px 18px;">
          <div style="font-family: 'Gunplay', 'Arial Black', sans-serif; font-size: 20px; text-transform: uppercase; color: var(--c-text, #211C13); margin-bottom: 8px;">Munition löschen</div>
          <p style="font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 1.5; color: var(--c-body, #4A3F29); margin: 0;">Diese Sorte wirklich löschen? Das lässt sich nicht rückgängig machen.</p>
        </div>
        <div style="padding: 14px 24px 18px; display: flex; gap: 12px; justify-content: flex-end; border-top: 1px solid var(--c-divider, #D6CCB6);">
          <button onClick="{{ cancelDelete }}" class="kr-ghost" style="height: 46px; padding: 0 22px; background: var(--c-surface, #FCFAF4); border: 1px solid var(--c-border, #C7BBA1); border-radius: 8px; color: var(--c-text, #211C13); cursor: pointer; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em;">Abbrechen</button>
          <button onClick="{{ confirmDelete }}" class="kr-danger" style="height: 46px; padding: 0 26px; background: #A8402E; border: none; border-radius: 8px; color: #FCFAF4; cursor: pointer; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em;">Löschen</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 940, &quot;height&quot;: 760 }
}">
class Component extends DCLogic {
  load(key) {
    try { const v = JSON.parse(localStorage.getItem(key)); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }

  state = {
    sorten: this.load('munition:liste'),
    confirm: null,
  };

  persist() {
    try { localStorage.setItem('munition:liste', JSON.stringify(this.state.sorten)); } catch (e) {}
  }

  goNew() {
    try { localStorage.setItem('munition:edit', JSON.stringify(null)); } catch (e) {}
    window.location.href = 'MunitionFormular.dc.html';
  }
  goEdit(i) {
    try { localStorage.setItem('munition:edit', JSON.stringify(i)); } catch (e) {}
    window.location.href = 'MunitionFormular.dc.html';
  }

  askDelete(i) { this.setState({ confirm: i }); }
  cancelDelete() { this.setState({ confirm: null }); }
  confirmDelete() {
    if (this.state.confirm === null) return;
    const a = this.state.sorten.slice(); a.splice(this.state.confirm, 1);
    this.setState({ sorten: a, confirm: null }, () => this.persist());
  }

  renderVals() {
    const view = this.state.sorten.map((m, i) => ({
      title: [m.hersteller, m.kaliber].filter(Boolean).join(' · ') || 'Ohne Bezeichnung',
      meta: [
        m.gewicht && ('Gew. ' + m.gewicht),
        m.speed && ('v ' + m.speed),
      ].filter(Boolean).join('   ·   ') || 'Keine weiteren Angaben',
      foto: m.foto || '',
      hasFoto: !!m.foto,
      noFoto: !m.foto,
      onEdit: () => this.goEdit(i),
      onDelete: () => this.askDelete(i),
    }));
    return {
      view,
      empty: this.state.sorten.length === 0,
      confirmOpen: this.state.confirm !== null,
      openNew: () => this.goNew(),
      cancelDelete: () => this.cancelDelete(),
      confirmDelete: () => this.confirmDelete(),
    };
  }
}
</script>
</body>
</html>
