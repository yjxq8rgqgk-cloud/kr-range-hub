<style>
  @font-face { font-family: 'Gunplay'; src: url('fonts/gunplay_rg.otf') format('opentype'); font-weight: 400 700; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .kr-ghost { transition: background 160ms cubic-bezier(.2,.7,.2,1), border-color 160ms, transform 120ms; }
  .kr-ghost:hover { background: #F4EEE0; border-color: #C9824E; }
  .kr-ghost:active { transform: translateY(1px); }
  .kr-cu { transition: background 160ms cubic-bezier(.2,.7,.2,1), transform 120ms; }
  .kr-cu:hover { background: #C9824E; }
  .kr-cu:active { background: #8C4F2C; transform: translateY(1px); }
  .kr-field { transition: border-color 140ms, box-shadow 140ms; }
  .kr-field::placeholder { color: #A89A7C; }
  .kr-field:focus { border-color: #B26A3E; box-shadow: 0 0 0 3px rgba(178,106,62,.18); }
  .kr-cap { transition: background 160ms, border-color 160ms, transform 120ms; }
  .kr-cap:hover { background: #2C261A; border-color: #C9824E; }
  .kr-cap:active { transform: translateY(1px); }
  .kr-remove { transition: background 140ms, color 140ms; }
  .kr-remove:hover { background: rgba(255,255,255,0.12); color: #FFFFFF; }
</style>
<style>
  :root{
    --c-bg:#F3EEE1; --c-header:#D7CAAE; --c-headerline:#C2B595; --c-surface:#FCFAF4;
    --c-input:#FFFFFF; --c-thumb:#EDE4D0; --c-border:#C7BBA1; --c-divider:#D6CCB6;
    --c-dash:#C9A982; --c-dashbg:rgba(252,250,244,0.55);
    --c-text:#211C13; --c-strong:#2B2418; --c-body:#4A3F29; --c-label:#5A4A30;
    --c-dim:#6E5F44; --c-faint:#8C7B58; --c-capbtn:#211C13; --c-capborder:#3A3122; --c-frame:#1B1812;
  }
  html.kr-dark{
    --c-bg:#14110B; --c-header:#221C12; --c-headerline:#2E2616; --c-surface:#1E1810;
    --c-input:#15100A; --c-thumb:#241D12; --c-border:#382D1C; --c-divider:#2C2415;
    --c-dash:#4A3B23; --c-dashbg:rgba(34,28,18,0.5);
    --c-text:#ECE4D2; --c-strong:#DCD1B6; --c-body:#C6B796; --c-label:#A89569;
    --c-dim:#B0A082; --c-faint:#94855F; --c-capbtn:#0E0A05; --c-capborder:#281F12; --c-frame:#0E0B06;
  }
  html.kr-dark .kr-ghost:hover{ background:#2A2316; border-color:#C9824E; }
  html.kr-dark .kr-iconbtn:hover{ background:#2A2316; border-color:#C9824E; }
  html.kr-dark .kr-icoedit:hover{ background:#2A2316; border-color:#C9824E; color:#C9824E; }
  html.kr-dark .kr-icodel:hover{ background:#2E1B16; border-color:#A8402E; color:#D2705E; }
  html.kr-dark .kr-dash:hover{ background:#241D12; border-color:#B26A3E; }
  html.kr-dark .kr-field::placeholder{ color:#7C6E50; }
  html.kr-dark svg[stroke="#A89A7C"]{ stroke:#6E6450; }
  html.kr-dark svg[stroke="#211C13"]{ stroke:#ECE4D2; }
  html.kr-dark [fill="#211C13"]{ fill:#ECE4D2; }
  html.kr-dark img[alt="KR"]{ filter: brightness(0) invert(1) opacity(0.82) !important; }
  html.kr-dark img[aria-hidden="true"]{ filter: brightness(0) invert(1) !important; }
</style>
<script>
(function(){
  function apply(){ try{ document.documentElement.classList.toggle('kr-dark', document.documentElement.getAttribute('data-theme') !== 'light'); }catch(e){} }
  apply();
  window.addEventListener('storage', function(e){ if(!e||e.key==null||e.key==='kr-hub-theme') apply(); });
  window.__krApplyTheme = apply;
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('app:seeded') === '1') return;
    function seedIfEmpty(key, data){
      var cur = localStorage.getItem(key), empty = true;
      if (cur){ try { var v = JSON.parse(cur); empty = !(Array.isArray(v) && v.length); } catch(e){ empty = true; } }
      if (empty) localStorage.setItem(key, JSON.stringify(data));
    }
    seedIfEmpty('waffen:liste', [

        <label for="z_teil" style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--c-label, #5A4A30); margin-bottom: 6px; display: block;">Teilebezeichnung</label>
        <input id="z_teil" class="kr-field" type="text" placeholder="z. B. Rotpunktvisier Micro H-2" defaultValue="{{ draft.teil }}" style="width: 100%; height: 46px; padding: 0 14px; background: var(--c-input, #FFFFFF); border: 1px solid var(--c-border, #C7BBA1); border-radius: 8px; color: var(--c-text, #211C13); font-family: 'Barlow', sans-serif; font-size: 15px; outline: none;">

        <label for="z_verbaut" style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--c-label, #5A4A30); margin-bottom: 6px; display: block;">Verbaut an</label>

<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 780, &quot;height&quot;: 820 }
}">
class Component extends DCLogic {
  loadList() {
    try { const v = JSON.parse(localStorage.getItem('zubehoer:liste')); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  loadWaffen() {
    try { const v = JSON.parse(localStorage.getItem('waffen:liste')); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  editIndex() {
    try { const v = JSON.parse(localStorage.getItem('zubehoer:edit')); return (typeof v === 'number') ? v : null; }
    catch (e) { return null; }
  }
  buildInitialState() {
    const list = this.loadList();
    const idx = this.editIndex();
    const cur = (idx !== null && list[idx]) ? list[idx] : {};
    return { list, idx, draft: cur, foto: cur.foto || '', waffen: this.loadWaffen(), verbautAn: cur.verbautAn || '' };
  }

  state = this.buildInitialState();

  val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  openCamera() { const el = document.getElementById('z_camera'); if (el) el.click(); }
  openUpload() { const el = document.getElementById('z_upload'); if (el) el.click(); }
  removeFoto() { this.setState({ foto: '' }); }

  onFile(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const max = 900;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        let url;
        try { url = c.toDataURL('image/jpeg', 0.72); } catch (err) { url = ev.target.result; }
        this.setState({ foto: url });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  }

  save() {
    const obj = {
      hersteller: this.val('z_hersteller'),
      teil: this.val('z_teil'),
      verbautAn: this.state.verbautAn || '',
      notizen: this.val('z_notizen'),
      foto: this.state.foto || '',
    };
    const arr = this.state.list.slice();
    if (this.state.idx === null) arr.push(obj); else arr[this.state.idx] = obj;
    try { localStorage.setItem('zubehoer:liste', JSON.stringify(arr)); }
    catch (e) { alert('Das Foto ist zu groß für den Speicher. Bitte ein kleineres Bild verwenden.'); return; }
    localStorage.removeItem('zubehoer:edit');
    window.location.href = 'MeinZubehoer.dc.html';
  }

  renderVals() {
    const waffenOptions = this.state.waffen.map((w) => {
      const label = ([w.hersteller, w.bezeichnung].filter(Boolean).join(' ') || 'Ohne Bezeichnung')
        + (w.seriennummer ? ('  ·  SN ' + w.seriennummer) : '');
      return { value: label, label };
    });
    return {
      pageTitle: this.state.idx === null ? 'Neues Zubehör' : 'Zubehör bearbeiten',
      draft: this.state.draft,
      waffenOptions,
      noWaffen: this.state.waffen.length === 0,
      verbautSel: this.state.verbautAn,
      onVerbaut: (e) => this.setState({ verbautAn: e.target.value }),
      foto: this.state.foto,
      hasFoto: !!this.state.foto,
      noFoto: !this.state.foto,
      openCamera: () => this.openCamera(),
      openUpload: () => this.openUpload(),
      removeFoto: () => this.removeFoto(),
      onFile: (e) => this.onFile(e),
      save: () => this.save(),
    };
  }
}
</script>
</body>
