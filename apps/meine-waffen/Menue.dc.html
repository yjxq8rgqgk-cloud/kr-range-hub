<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Gunplay';
    src: url('fonts/gunplay_rg.otf') format('opentype');
    font-weight: 400 700;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .kr-ghost { transition: background 160ms cubic-bezier(.2,.7,.2,1), border-color 160ms, transform 120ms; }
  .kr-ghost:hover { background: #F4EEE0; border-color: #C9824E; }
  .kr-ghost:active { transform: translateY(1px); }
</style>
<style>
  :root{
    --c-bg:#F3EEE1; --c-header:#D7CAAE; --c-headerline:#C2B595; --c-surface:#FCFAF4;
    --c-input:#FFFFFF; --c-thumb:#EDE4D0; --c-border:#C7BBA1; --c-divider:#D6CCB6;
    --c-dash:#C9A982; --c-dashbg:rgba(252,250,244,0.55);
    --c-text:#211C13; --c-strong:#2B2418; --c-body:#4A3F29; --c-label:#5A4A30;
    --c-dim:#6E5F44; --c-faint:#8C7B58; --c-capbtn:#211C13; --c-capborder:#3A3122; --c-frame:#1B1812;
  }
  html.kr-dark{
    --c-bg:#14110B; --c-header:#221C12; --c-headerline:#2E2616; --c-surface:#1E1810;
    --c-input:#15100A; --c-thumb:#241D12; --c-border:#382D1C; --c-divider:#2C2415;
    --c-dash:#4A3B23; --c-dashbg:rgba(34,28,18,0.5);
    --c-text:#ECE4D2; --c-strong:#DCD1B6; --c-body:#C6B796; --c-label:#A89569;
    --c-dim:#B0A082; --c-faint:#94855F; --c-capbtn:#0E0A05; --c-capborder:#281F12; --c-frame:#0E0B06;
  }
  html.kr-dark .kr-ghost:hover{ background:#2A2316; border-color:#C9824E; }
  html.kr-dark .kr-iconbtn:hover{ background:#2A2316; border-color:#C9824E; }
  html.kr-dark .kr-icoedit:hover{ background:#2A2316; border-color:#C9824E; color:#C9824E; }
  html.kr-dark .kr-icodel:hover{ background:#2E1B16; border-color:#A8402E; color:#D2705E; }
  html.kr-dark .kr-dash:hover{ background:#241D12; border-color:#B26A3E; }
  html.kr-dark .kr-field::placeholder{ color:#7C6E50; }
  html.kr-dark svg[stroke="#A89A7C"]{ stroke:#6E6450; }
  html.kr-dark svg[stroke="#211C13"]{ stroke:#ECE4D2; }
  html.kr-dark [fill="#211C13"]{ fill:#ECE4D2; }
  html.kr-dark img[alt="KR"]{ filter: brightness(0) invert(1) opacity(0.82) !important; }
  html.kr-dark img[aria-hidden="true"]{ filter: brightness(0) invert(1) !important; }
</style>
<script>
(function(){
  function apply(){ try{ document.documentElement.classList.toggle('kr-dark', document.documentElement.getAttribute('data-theme') !== 'light'); }catch(e){} }
  apply();
  window.addEventListener('storage', function(e){ if(!e||e.key==null||e.key==='kr-hub-theme') apply(); });
  window.__krApplyTheme = apply;
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('app:seeded') === '1') return;
    function seedIfEmpty(key, data){
      var cur = localStorage.getItem(key), empty = true;
      if (cur){ try { var v = JSON.parse(cur); empty = !(Array.isArray(v) && v.length); } catch(e){ empty = true; } }
      if (empty) localStorage.setItem(key, JSON.stringify(data));
    }
    seedIfEmpty('waffen:liste', [
      { hersteller: 'Heckler & Koch', bezeichnung: 'P30', kaliber: '9 mm Luger', seriennummer: 'HK-204571', foto: '' },
      { hersteller: 'CZ', bezeichnung: '457 Varmint', kaliber: '.22 lr', seriennummer: 'CZ-889123', foto: '' }
    ]);
    seedIfEmpty('munition:liste', [
      { hersteller: 'RUAG GECO', kaliber: '9 mm Luger', gewicht: '8,0 g / 124 gr', speed: '360 m/s', foto: '' },
      { hersteller: 'SK Standard Plus', kaliber: '.22 lr', gewicht: '2,6 g / 40 gr', speed: '331 m/s', foto: '' }
    ]);
    seedIfEmpty('zubehoer:liste', [
      { hersteller: 'Aimpoint', teil: 'Rotpunktvisier Micro H-2', verbautAn: 'Heckler & Koch P30  \u00b7  SN HK-204571', notizen: 'Montage auf dem Verschluss, 2 MOA. Batterie zuletzt 03/2025 gewechselt.', foto: '' },
      { hersteller: 'Harris', teil: 'Zweibein 6\u20139\u2033', verbautAn: 'CZ 457 Varmint  \u00b7  SN CZ-889123', notizen: 'Schnellverschluss-Adapter, bei K\u00e4lte leicht klemmig.', foto: '' }
    ]);
    seedIfEmpty('profil:vereine', [
      { name: 'SV Tell Hubertus', nr: '1894-22', mitglied: '04711', eintritt: '2019-03-12' },
      { name: 'BDS Gau Mittelrhein', nr: 'GM-7783', mitglied: '11920', eintritt: '2021-09-01' }
    ]);
    seedIfEmpty('profil:wbk', [
      { farbe: 'gr\u00fcn', behoerde: 'Landratsamt Musterstadt', datum: '2022-05-17', nummer: 'WBK-2022-0815', nid: 'NID-44120', nud: 'NUD-77810' },
      { farbe: 'gelb', behoerde: 'Ordnungsamt Beispielheim', datum: '2023-11-03', nummer: 'WBK-2023-1190', nid: 'NID-50233', nud: 'NUD-90021' }
    ]);
    localStorage.setItem('app:seeded','1');
  } catch(e){}
})();
</script>
<script src="./i18n.js"></script>
