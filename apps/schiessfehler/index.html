  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    // The unpacking above replaces document.documentElement wholesale, which
    // wipes out the "Zurück zum Hub" button + stylesheet that shared/theme.js
    // had already injected before the bundle finished loading. Restore both.
    if (!document.querySelector('link[href*="theme.css"]')) {
      var themeLink = document.createElement('link');
      themeLink.rel = 'stylesheet';
      themeLink.href = '../../shared/theme.css';
      document.head.appendChild(themeLink);
    }
    if (!document.querySelector('.kr-hub-home')) {
      var hubBtn = document.createElement('a');
      hubBtn.className = 'kr-hub-home';
      hubBtn.href = '../../index.html';
      hubBtn.setAttribute('aria-label', 'Zurück zum Hub');
      hubBtn.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>' +
        '<span>Hub</span>';
      document.body.appendChild(hubBtn);
    }
    // The swap above also drops the data-theme attribute theme.js had already
    // set on the old documentElement (dark/light/system choice). Recompute
    // and re-apply it so the app matches the hub's saved preference.
    if (window.KRHubTheme) {
      var _theme = window.KRHubTheme.get();
      var _mode = _theme;
      if (_theme === 'system') {
        _mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', _mode);
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 #D2B05A;\n  --steel: #9A988F;\n  --steel-light: #C2C0B6;\n  --gunmetal: #33332F;\n\n  /* ============================================================\n     COLOR — semantic\n     ============================================================ */\n  --bg: var(--ink-900);\n  --bg-raised: var(--ink-700);\n  --bg-sunken: var(--ink-850);\n  --surface: var(--ink-800);\n  --surface-hover: var(--ink-600);\n\n  --fg: var(--bone-050);          /* primary text */\n  --fg-muted: var(--sand-100);    /* body text */\n  --fg-dim: var(--earth-300);     /* secondary */\n  --fg-faint: var(--earth-400);   /* disabled / captions */\n\n  --border: var(--ink-600);\n  --border-strong: var(--ink-500);\n  --border-metal: #5A4A30;\n\n  --primary: var(--copper);          /* default action */\n  --primary-hover: var(--copper-bright);\n  --primary-press: var(--copper-deep);\n  --primary-fg: #1B130C;             /* text on copper */\n\n  --accent: var(--bronze);           /* highlights, KR gold */\n  --accent-2: var(--gold);\n\n  --success: #6E8A3C;\n  --warning: #C9924A;\n  --danger: #A8402E;\n  --info: var(--steel);\n\n  --focus-ring: var(--copper-bright);\n\n  /* ============================================================\n     TYPE — families\n     Display = Gunplay (tactical block). Stamp = Ghost Factory\n     (distressed, impact only). Body/UI = Barlow. Tech labels =\n     Barlow Semi Condensed / JetBrains Mono.\n     ============================================================ */\n  --font-display: 'Gunplay', 'Arial Black', sans-serif;\n  --font-stamp: 'Ghost Factory', 'Gunplay', sans-serif;\n  --font-body: 'Barlow', system-ui, -apple-system, sans-serif;\n  --font-cond: 'Barlow Semi Condensed', 'Barlow', sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;\n\n  /* TYPE — fluid scale (1.25 major-third-ish) */\n  --text-xs: 12px;\n  --text-sm: 14px;\n  --text-base: 16px;\n  --text-md: 18px;\n  --text-lg: 22px;\n  --text-xl: 28px;\n  --text-2xl: 36px;\n  --text-3xl: 48px;\n  --text-4xl: 64px;\n  --text-5xl: 88px;\n\n  --leading-tight: 1.02;\n  --leading-snug: 1.18;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  --tracking-tight: -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-wider: 0.12em;   /* tactical labels */\n  --tracking-widest: 0.22em;  /* stamps */\n\n  /* ============================================================\n     SPACING — 4px base\n     ============================================================ */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* RADII — small & hard-edged; tactical, not soft */\n  --radius-none: 0px;\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 8px;\n  --radius-pill: 999px;\n\n  /* BORDERS */\n  --border-w: 1px;\n  --border-w-2: 2px;\n\n  /* SHADOWS — deep, low, warm-black. Used sparingly. */\n  --shadow-sm: 0 1px 2px rgba(0,0,0,.45);\n  --shadow-md: 0 6px 18px rgba(0,0,0,.45);\n  --shadow-lg: 0 18px 48px rgba(0,0,0,.55);\n  --shadow-inset: inset 0 1px 0 rgba(255,255,255,.04);\n  --glow-copper: 0 0 0 1px rgba(201,130,78,.35), 0 8px 28px rgba(178,106,62,.18);\n\n  /* MOTION */\n  --ease-out: cubic-bezier(.2,.7,.2,1);\n  --ease-in-out: cubic-bezier(.5,0,.2,1);\n  --dur-fast: 120ms;\n  --dur: 200ms;\n  --dur-slow: 360ms;\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES — apply on a .kr-type scope or use\n   the utility classes directly.\n   ============================================================ */\n.kr-h1, h1.kr {\n  font-family: var(--font-display);\n  font-size: var(--text-4xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  text-transform: uppercase;\n  color: var(--fg);\n  margin: 0;\n}\n.kr-h2, h2.kr {\n  font-family: var(--font-display);\n  font-size: var(--text-2xl);\n  line-height: var(--leading-snug);\n  text-transform: uppercase;\n  color: var(--fg);\n  margin: 0;\n}\n.kr-h3, h3.kr {\n  font-family: var(--font-cond);\n  font-weight: 700;\n  font-size: var(--text-xl);\n  line-height: var(--leading-snug);\n  color: var(--fg);\n  margin: 0;\n}\n.kr-stamp {\n  font-family: var(--font-stamp);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-widest);\n  color: var(--accent);\n}\n.kr-eyebrow, .kr-label {\n  font-family: var(--font-cond);\n  font-weight: 600;\n  font-size: var(--text-xs);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-wider);\n  color: var(--copper-bright);\n}\n.kr-body, p.kr {\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-muted);\n  margin: 0;\n}\n.kr-lead {\n  font-family: var(--font-body);\n  font-size: var(--text-md);\n  line-height: var(--leading-normal);\n  color: var(--fg-muted);\n}\n.kr-small {\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  color: var(--fg-dim);\n}\n.kr-mono, code.kr {\n  font-family: var(--font-mono);\n  font-size: var(--text-sm);\n  letter-spacing: 0.02em;\n  color: var(--steel-light);\n}\n.kr-spec {\n  font-family: var(--font-mono);\n  font-size: var(--text-xs);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-wide);\n  color: var(--fg-dim);\n}\n<\u002Fstyle>\n  <script src=\"ea5501f3-2890-43ad-a248-c7eedf96d89f\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; padding: 0; height: 100%; background: var(--ink-900); }\n    ::-webkit-scrollbar { width: 8px; height: 8px; }\n    ::-webkit-scrollbar-thumb { background: var(--ink-600); border-radius: 4px; }\n    ::-webkit-scrollbar-track { background: transparent; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"{{ rootStyle }}\">\n\n<sc-if value=\"{{ isAppPage }}\" hint-placeholder-val=\"{{ true }}\">\n\n  <div style=\"position:absolute;right:-60px;bottom:-60px;width:460px;height:460px;background:url(&quot; item,\n        onSelect: () => this.selectFehler(item.id)\n      })),\n      themeButtons: [\n        { key: 'dark', label: 'Dunkel' },\n        { key: 'light', label: 'Hell' }\n      ].map(o => ({\n        label: o.label,\n        onClick: () => this.setTheme(o.key),\n        bg: o.key === s.theme ? 'var(--copper)' : 'transparent',\n        fg: o.key === s.theme ? '#1B130C' : 'var(--sand-100)'\n      })),\n      hasSearch: s.search.length > 0,\n      clearSearch: () => this.clearSearch(),\n      showTrainerTips,\n      toggleTips: () => this.toggleTips(),\n      showTips: s.showTips,\n      tips: s.tips,\n      stopProp: (e) => e.stopPropagation(),\n      toggleFavOnly: () => this.toggleFavOnly(),\n      favCount: s.favorites.size,\n      favBtnBg: s.favOnly ? 'rgba(178,106,62,.18)' : 'transparent',\n      favBtnBorder: s.favOnly ? 'var(--copper-deep)' : 'var(--border-strong)',\n      favBtnColor: s.favOnly ? 'var(--copper-bright)' : 'var(--sand-100)',\n\n      waffeButtons: WAFFE_OPTIONS.map(o => ({\n        label: o.label,\n        onClick: () => this.setWaffe(o.key),\n        bg: o.key === s.waffe ? 'var(--copper)' : 'transparent',\n        fg: o.key === s.waffe ? '#1B130C' : 'var(--sand-100)'\n      })),\n      hasKategorieOptions: kategorieOptions.length > 0,\n      kategorieButtons: kategorieOptions.map(o => ({\n        label: o.label,\n        onClick: () => this.setKategorie(o.key),\n        bg: o.key === s.kategorie ? 'var(--bronze)' : 'transparent',\n        fg: o.key === s.kategorie ? '#1B130C' : 'var(--sand-100)'\n      })),\n      search: s.search,\n      onSearchChange: (e) => this.setState({ search: e.target.value }),\n      resultCount: filteredList.length,\n\n      isLoading: s.data === null,\n      isEmpty: s.data !== null && filteredList.length === 0,\n      filteredList,\n\n      listPaneStyle,\n      detailPaneStyle,\n      isMobile,\n      backToList: () => this.backToList(),\n\n      hasSelected: !!sel,\n      showEmptyDetail: !sel,\n      sel,\n      selFavColor: sel && s.favorites.has(sel.id) ? 'var(--copper-bright)' : 'var(--earth-400)',\n      toggleSelFav: () => sel && this.toggleFav(sel.id),\n\n      infoGridCols: isMobile ? '1fr' : '1fr 1fr',\n\n      hasPair: !!pair,\n      pair,\n      showCompare: s.showCompare,\n      toggleCompare: () => this.toggleCompare(),\n      compareBtnLabel: s.showCompare ? 'Ausblenden' : 'Vergleichen',\n\n      mediaPanels,\n      preventDefault: (e) => e.preventDefault(),\n\n      logDraft: s.logDraft,\n      onLogDraftChange: (e) => this.setState({ logDraft: e.target.value }),\n      addLogEntry: () => this.addLogEntry(),\n      hasLogEntries: selLogEntries.length > 0,\n      noLogEntries: selLogEntries.length === 0,\n      selLogEntries\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
